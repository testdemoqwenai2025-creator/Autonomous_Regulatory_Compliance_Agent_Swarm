# Maritime Global Compliance Swarm
# docker-compose up --build          # start gateway + DB + MTTR tracker
# docker-compose --profile tools up   # also run one-shot CLI tools

services:
  # ── Database ──────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: maritime_compliance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── API Gateway (Python FastAPI) ─────────────────
  gateway:
    build:
      context: ./python
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DB_DRIVER: postgresql+psycopg2
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: maritime_compliance
      DB_USER: postgres
      DB_PASSWORD: mysecretpassword
      MTTR_TRACKER_URL: http://mttr-tracker:8080
      GATEWAY_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mttr-tracker:
        condition: service_started
    command: ["python", "-m", "gateway"]

  # ── MTTR Tracker (Golang) ─────────────────────────
  mttr-tracker:
    build:
      context: ./golang
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DB_DRIVER: postgresql
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: maritime_compliance
      DB_USER: postgres
      DB_PASSWORD: mysecretpassword
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # ── PII Anonymiser (Python) ────────────────────────
  anonymiser:
    build:
      context: ./python
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./data/manifests:/data/manifests:ro
      - ./data/output:/data/output
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "anonymiser.cli", "anonymise", "--manifest", "/data/manifests/sample.json", "--dry-run"]
    profiles:
      - tools

  # ── EDI SQL Auditor (Python) ───────────────────────
  auditor:
    build:
      context: ./python
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["python", "-m", "edi_auditor.cli"]
    command: ["run", "--all"]
    profiles:
      - tools

  # ── Remediation Generator (Python) ─────────────────
  remediation:
    build:
      context: ./python
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["python", "-m", "remediation.cli"]
    command: ["generate-policies", "--mode", "dry-run"]
    profiles:
      - tools

volumes:
  pgdata:
