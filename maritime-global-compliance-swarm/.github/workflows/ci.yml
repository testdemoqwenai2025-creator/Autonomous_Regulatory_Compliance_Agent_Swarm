name: Maritime Compliance Swarm CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install ruff mypy
      - name: Ruff lint
        run: ruff check python/
      - name: Ruff format check
        run: ruff format --check python/

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r python/requirements.txt
          pip install pytest pytest-cov pytest-mock
      - name: Run tests
        env:
          DB_DRIVER: sqlite
          SQLITE_PATH: /tmp/test_compliance.db
        run: python -m pytest python/ -v --tb=short --cov=python --cov-report=xml

  golang-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          working-directory: golang

  golang-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run tests
        working-directory: golang
        run: go test ./... -v -race

  docker-build:
    runs-on: ubuntu-latest
    needs: [python-lint, python-test, golang-lint, golang-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Python image
        run: docker build -t maritime-swarm-python ./python
      - name: Build Go image
        run: docker build -t maritime-swarm-mttr ./golang
      - name: Docker compose config check
        run: docker compose config